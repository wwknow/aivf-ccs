services:
  public-portal:
    build: .
    container_name: aivf-wwknow-public-portal
    restart: unless-stopped

    # v0.2-A and v0.2-B remain frozen on host loopback.
    network_mode: host

    environment:
      PORTAL_HOST: 127.0.0.1
      PORTAL_PORT: "18052"
      VERIFIER_BASE: http://127.0.0.1:18050
      DEMO_BASE: http://127.0.0.1:18051
      UPSTREAM_TIMEOUT: "3.0"
      MAX_BODY_BYTES: "262144"
      DEMO_RATE_LIMIT: "10"
      VERIFY_RATE_LIMIT: "60"
      RATE_WINDOW_SECONDS: "60"

    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18052/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
